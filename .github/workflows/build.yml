name: Build & Publish Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass android \
            -alias mochi \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Mochi Reader,O=Mochi,C=US"

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign & Align Release APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk Mochi-Reader.apk
          else
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
            $BUILD_TOOLS/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk Mochi-Reader-aligned.apk
            $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:android --out Mochi-Reader.apk Mochi-Reader-aligned.apk
          fi

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mochi Reader (Latest Release Build)
          body: Automatically built Release APK from commit `${{ github.sha }}`.
          files: Mochi-Reader.apk
          overwrite_files: true
