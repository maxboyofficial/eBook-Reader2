name: Build & Publish Release APK

on:
  push:
    branches: [ main, master ]
  workflow_run:
    workflows: ["Hourly AI Code Scrutiny & Optimizer"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass android \
            -alias upload \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Mochi Reader,O=Mochi,C=US"
          cp my-upload-key.jks app/my-upload-key.jks

      - name: Build Release APK
        run: |
          cat << 'EOF' > init-signing.gradle.kts
          allprojects {
            afterEvaluate {
              extensions.findByName("android")?.let { androidExt ->
                val signingConfigs = androidExt.javaClass.getMethod("getSigningConfigs").invoke(androidExt)
                val releaseConfig = signingConfigs.javaClass.getMethod("findByName", String::class.java).invoke(signingConfigs, "release")
                if (releaseConfig != null) {
                  releaseConfig.javaClass.getMethod("setStoreFile", java.io.File::class.java).invoke(releaseConfig, rootProject.file("my-upload-key.jks"))
                  releaseConfig.javaClass.getMethod("setStorePassword", String::class.java).invoke(releaseConfig, "android")
                  releaseConfig.javaClass.getMethod("setKeyAlias", String::class.java).invoke(releaseConfig, "upload")
                  releaseConfig.javaClass.getMethod("setKeyPassword", String::class.java).invoke(releaseConfig, "android")
                }
              }
            }
          }
          EOF
          gradle assembleRelease --init-script init-signing.gradle.kts

      - name: Copy Release APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk Mochi-Reader.apk
          else
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mochi Reader (Latest Release Build)
          body: Automatically built Release APK from commit `${{ github.sha }}` (${{ github.run_number }}).
          files: Mochi-Reader.apk
          overwrite_files: true
          make_latest: true
