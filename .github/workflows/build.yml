name: Build & Publish Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # ----- Rust toolchain -----
      - name: Install Rust toolchain for Android target
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          override: true
          profile: minimal

      # ----- Android SDK & NDK -----
      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            build-tools;34.0.0
            platforms;android-34
            ndk;25.2.9519653

      # ----- Run unit tests (optional) -----
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        continue-on-error: true

      # ----- Generate release keystore -----
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass android \
            -alias upload \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Kismis Reader,O=Kismis,C=US"
          cp my-upload-key.jks app/my-upload-key.jks

      # ----- Build Rust library -----
      - name: Build Rust shared library
        run: |
          cd rust-app
          cargo build --release --target aarch64-linux-android
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      # ----- Assemble Release APK with signing -----
      - name: Assemble Release APK with signing
        run: |
          cat <<'EOF' > init-signing.gradle.kts
          allprojects {
            afterEvaluate {
              extensions.findByName("android")?.let { androidExt ->
                val signingConfigs = androidExt.javaClass.getMethod("getSigningConfigs").invoke(androidExt)
                val releaseConfig = signingConfigs.javaClass.getMethod("findByName", String::class.java).invoke(signingConfigs, "release")
                if (releaseConfig != null) {
                  releaseConfig.javaClass.getMethod("setStoreFile", java.io.File::class.java).invoke(releaseConfig, rootProject.file("my-upload-key.jks"))
                  releaseConfig.javaClass.getMethod("setStorePassword", String::class.java).invoke(releaseConfig, "android")
                  releaseConfig.javaClass.getMethod("setKeyAlias", String::class.java).invoke(releaseConfig, "upload")
                  releaseConfig.javaClass.getMethod("setKeyPassword", String::class.java).invoke(releaseConfig, "android")
                }
              }
            }
          }
          EOF
          ./gradlew assembleRelease --init-script init-signing.gradle.kts

      # ----- Copy Release APK -----
      - name: Copy Release APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk Kismis-Reader.apk
          else
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

      # ----- Publish APK to GitHub Releases -----
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kismis eBook Reader (Latest Release Build)
          body: Automatically built Release APK from commit `${{ github.sha }}` (${{ github.run_number }}).
          files: Kismis-Reader.apk
          overwrite_files: true
          make_latest: true
