name: Build & Publish Release APK

on:
  push:
    branches: [ main, master ]
  workflow_run:
    workflows: ["Hourly AI Code Scrutiny & Optimizer"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass android \
            -alias upload \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Mochi Reader,O=Mochi,C=US"

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Copy Release APK
        run: cp app/build/outputs/apk/release/app-release.apk Mochi-Reader.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mochi Reader (Latest Release Build)
          body: Automatically built Release APK from commit `${{ github.sha }}`.
          files: Mochi-Reader.apk
          overwrite_files: true
